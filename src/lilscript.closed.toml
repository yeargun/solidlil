# Browser application delivery, using the current compiler policy.
[policy]
version = 3
[policy.tactics]
# Nested async closure capture currently fails compiler verification with inlining.
inlining = "off"
startup-reconstruction = "on"
recurring-reconstruction = "off"
[javascript]
priority = "size-first"
strip_debug = true
assume_pristine_builtins = true
[effort]
level = 13
[objective]
codecs = "brotli"
[mangle]
identifiers = true
properties = true
pool_strings = true
[delivery]
mode = "single"
host_modules = "embed"
[policy.resources]
logical_work = 8000000000
[execution]
jobs = 1
